[package]
name = "rostery-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
