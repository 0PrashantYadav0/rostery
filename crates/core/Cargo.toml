[package]
name = "rostery-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = "3.5.1"
base64 = "0.22"
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1.7.2"
